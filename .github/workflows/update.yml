name: update

# 3시간마다 사례를 모아 커밋하고 GitHub Pages 로 다시 배포합니다.
# Actions 탭의 "Run workflow" 에서 URL 을 넣으면 그 게시물만 바로 추가합니다.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: '추가할 게시물 URL (여러 개는 공백으로 구분, 비우면 전체 갱신)'
        required: false
        default: ''
      refresh_all:
        description: '저장된 원문을 모두 다시 받아 수치 갱신'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_APP_TOKEN: ${{ secrets.INSTAGRAM_APP_TOKEN }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_REFRESH_ALL: ${{ inputs.refresh_all }}
        run: |
          set -f  # URL 안의 * 등이 파일 이름으로 펼쳐지지 않게
          if [ -n "$INPUT_URL" ]; then
            node scripts/update.mjs --add $INPUT_URL || true
          elif [ "$INPUT_REFRESH_ALL" = "true" ]; then
            node scripts/update.mjs --refresh-all || true
          else
            node scripts/update.mjs || true
          fi
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build site
        # 화면에 필요한 파일만 올립니다. (scripts, config, .env 등은 제외)
        run: |
          mkdir -p _site/data
          cp -r index.html css js _site/
          cp data/cases.js _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
